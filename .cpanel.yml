---
deployment:
  tasks:
    # Create required runtime directories (logs, upload subdirs) if missing
    - /bin/mkdir -p backend/logs
    - /bin/mkdir -p backend/tmp
    - /bin/mkdir -p backend/uploads/pm-reports
    - /bin/mkdir -p backend/uploads/bulkpm-reports
    - /bin/mkdir -p backend/uploads/signed-pm-reports
    - /bin/mkdir -p backend/uploads/signature
    - /bin/mkdir -p backend/uploads/signature-staff
    - /bin/mkdir -p backend/uploads/project-logo

    # Debug: show node/npm availability and versions in deploy logs
    - /usr/bin/which node || true
    - /usr/bin/which npm || true
    - node -v || true
    - npm -v || true

    # Install and build the frontend explicitly via its package directory.
    # Use npm ci where possible, fall back to a production npm install.
    - npm ci --prefix frontend --omit=dev --workspaces=false || npm install --prefix frontend --production --workspaces=false || true
    - npm run build --prefix frontend || true

    # Also include the original, explicit install/build commands for environments
    # that expect plain `npm install` and `npm run build` with --prefix.
    - npm install --prefix frontend --workspaces=false
    - npm run build --prefix frontend

    # Optional: if PUBLIC_DIR is provided by cPanel, sync built frontend there and fix permissions
    - if [ -n "${PUBLIC_DIR:-}" ]; then /bin/mkdir -p "$PUBLIC_DIR"; if command -v rsync >/dev/null 2>&1; then rsync -av --delete frontend/build/ "$PUBLIC_DIR/"; else /bin/cp -a frontend/build/. "$PUBLIC_DIR/"; fi; /bin/chmod -R 755 "$PUBLIC_DIR"; ls -la "$PUBLIC_DIR" || true; fi

    # Install backend production dependencies for Passenger.
    - npm install --prefix backend --omit=dev || true

    # Ensure upload and log directories are writable by the Node.js process
    - /bin/chmod -R 755 backend/uploads
    - /bin/chmod -R 755 backend/logs

    # Trigger Passenger restart after deploy
    - /usr/bin/touch backend/tmp/restart.txt
