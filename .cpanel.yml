---
deployment:
  tasks:
    - /bin/echo "Starting Inventra staging deployment"
    - /usr/bin/env npm --prefix backend install --omit=dev
    - /usr/bin/env npm --prefix frontend install
    - /usr/bin/env npm --prefix frontend run build
    - /bin/cp -f env.production backend/.env
    - /bin/mkdir -p backend/uploads backend/logs
    - /bin/echo "Inventra staging deployment completed"